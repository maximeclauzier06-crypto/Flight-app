<!DOCTYPE html>
<!--
  The picture shown when someone shares a Halfway Trips link (WhatsApp,
  Messenger, iMessage, Facebook, LinkedIn...): share.jpg, 1200 x 630.
  It's made from this page, in the site's banner style. To make it again
  after changing this file (Windows, with Microsoft Edge):

    "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --headless=new --hide-scrollbars --window-size=1200,630 --virtual-time-budget=8000 --screenshot=share.png tools/share-image.html

  then save share.png as share.jpg (JPEG, about 85% quality, so it stays well
  under WhatsApp's ~300 KB) at the top of the site, and rename it (share-2.jpg...)
  in the og:image tags of every page: apps keep the old picture otherwise.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&amp;family=Manrope:wght@700;800&amp;display=block">
  <style>
    html, body { margin: 0; }
    .card {
      position: relative; width: 1200px; height: 630px; overflow: hidden; box-sizing: border-box; padding: 58px 70px;
      font-family: 'Manrope', sans-serif; color: #FFF6E6;
      /* The banner: terracotta, soft sun rays, and the sun rising bottom right */
      background:
        repeating-conic-gradient(from 0deg at 80% 112%, rgba(255, 236, 200, 0.10) 0deg 5deg, rgba(255, 236, 200, 0) 5deg 10deg),
        radial-gradient(circle at 80% 112%, #F2B33D 0 190px, rgba(242, 179, 61, 0) 192px),
        linear-gradient(160deg, #B5401F 0%, #D9612E 100%);
    }
    .brand {
      display: inline-flex; align-items: center; gap: 12px; padding: 10px 22px 10px 14px; border-radius: 999px;
      background: #FFF6E6; color: #2A1D16; font-family: 'Outfit', sans-serif; font-size: 28px; font-weight: 700;
    }
    h1 { margin: 52px 0 18px; max-width: 690px; font-family: 'Outfit', sans-serif; font-size: 78px; font-weight: 600; line-height: 1.02; letter-spacing: -1.5px; }
    p { margin: 0; max-width: 640px; color: #FBE0C2; font-size: 30px; font-weight: 700; line-height: 1.3; }
    .url {
      position: absolute; left: 70px; bottom: 54px; padding: 10px 20px; border-radius: 999px;
      background: #F2C14E; color: #3A1E10; font-size: 24px; font-weight: 800; letter-spacing: 0.4px;
    }
    .art { position: absolute; left: 0; top: 0; }
    .tag {
      position: absolute; padding: 9px 18px; border-radius: 999px; background: #fff; color: #2A1D16;
      font-size: 22px; font-weight: 800; box-shadow: 0 10px 22px rgba(60, 40, 30, 0.25); white-space: nowrap;
    }
    .tag.meet { background: #F2B33D; color: #2B1608; }
  </style>
</head>
<body>
  <div class="card">
    <!-- Two people, two dotted routes, one meeting point (the logo's idea, big) -->
    <svg class="art" width="1200" height="630" viewBox="0 0 1200 630" fill="none" aria-hidden="true">
      <path d="M800 150 Q 830 330 975 395" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-dasharray="0.1 15" opacity="0.9"></path>
      <path d="M800 150 Q 830 330 975 395" stroke="#C24A1F" stroke-width="7" stroke-linecap="round" stroke-dasharray="0.1 15"></path>
      <path d="M1125 205 Q 1110 330 975 395" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-dasharray="0.1 15" opacity="0.9"></path>
      <path d="M1125 205 Q 1110 330 975 395" stroke="#5B6B2E" stroke-width="7" stroke-linecap="round" stroke-dasharray="0.1 15"></path>
      <circle cx="800" cy="150" r="30" stroke="#FFF6E6" stroke-width="3" opacity="0.6"></circle>
      <circle cx="800" cy="150" r="14" fill="#C24A1F" stroke="#fff" stroke-width="5"></circle>
      <circle cx="1125" cy="205" r="30" stroke="#FFF6E6" stroke-width="3" opacity="0.6"></circle>
      <circle cx="1125" cy="205" r="14" fill="#5B6B2E" stroke="#fff" stroke-width="5"></circle>
      <circle cx="975" cy="395" r="62" fill="#F2B33D" opacity="0.22"></circle>
      <circle cx="975" cy="395" r="38" fill="#F2B33D" opacity="0.4"></circle>
      <circle cx="975" cy="395" r="18" fill="#F2B33D" stroke="#fff" stroke-width="5"></circle>
    </svg>
    <div class="tag" style="left: 836px; top: 128px;">You</div>
    <div class="tag" style="left: 1000px; top: 132px;">Them</div>
    <div class="tag meet" style="left: 912px; top: 455px;">Meet here</div>

    <div class="brand">
      <svg width="48" height="35" viewBox="2 8 44 32" fill="none" aria-hidden="true">
        <path d="M8 34 Q13 19 24 19" stroke="#C24A1F" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="0.1 5.5"></path>
        <path d="M40 34 Q35 19 24 19" stroke="#5B6B2E" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="0.1 5.5"></path>
        <circle cx="8" cy="35" r="4.5" fill="#C24A1F"></circle>
        <circle cx="40" cy="35" r="4.5" fill="#5B6B2E"></circle>
        <circle cx="24" cy="19" r="10" fill="#F2B33D" opacity="0.3"></circle>
        <circle cx="24" cy="19" r="6" fill="#F2B33D"></circle>
      </svg>
      Halfway Trips
    </div>
    <h1>Find where to meet in the middle</h1>
    <p>Two cities, the same dates, the full price for both of you — cheapest first.</p>
    <div class="url">halfwaytrips.com</div>
  </div>
</body>
</html>
