<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flight Plan — find where to meet</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="page-header">
    <h1>Flight Plan</h1>
    <p>Enter both your airports. We'll find the cheapest places you can both fly to.</p>
  </header>

  <main>
    <!-- The search form: this is all the input we need for v1 -->
    <form id="search-form" class="search-form">
      <div class="field">
        <label for="origin-a">Your airport</label>
        <div class="autocomplete">
          <input type="text" id="origin-a" placeholder="Start typing a city or airport…" autocomplete="off" required>
          <ul class="suggestions" id="origin-a-suggestions" role="listbox"></ul>
        </div>
      </div>

      <div class="field">
        <label for="origin-b">Their airport</label>
        <div class="autocomplete">
          <input type="text" id="origin-b" placeholder="Start typing a city or airport…" autocomplete="off" required>
          <ul class="suggestions" id="origin-b-suggestions" role="listbox"></ul>
        </div>
      </div>

      <div class="field">
        <label>When?</label>
        <div class="toggle-group" role="radiogroup" aria-label="Date mode">
          <label class="toggle-option">
            <input type="radio" name="date-mode" id="mode-flexible" value="flexible" checked>
            Flexible — lowest price
          </label>
          <label class="toggle-option">
            <input type="radio" name="date-mode" id="mode-specific" value="specific">
            Specific dates
          </label>
        </div>
      </div>

      <div class="field" id="flexible-fields">
        <label for="duration">Trip length</label>
        <select id="duration">
          <option value="weekend">A weekend (2 nights, Fri/Sat departure)</option>
          <option value="week" selected>A full week (7 nights)</option>
          <option value="custom">Custom number of nights</option>
        </select>
      </div>

      <div class="field" id="custom-nights-field" hidden>
        <label for="custom-nights">How many nights?</label>
        <input type="number" id="custom-nights" min="1" max="30" value="5">
      </div>

      <div class="field" id="specific-fields" hidden>
        <label>Dates</label>
        <div class="date-row">
          <input type="date" id="depart-date" aria-label="Depart date">
          <span>to</span>
          <input type="date" id="return-date" aria-label="Return date">
        </div>
      </div>

      <button type="submit">Find destinations</button>
    </form>

    <!-- Results get inserted here by app.js -->
    <section id="results" class="results" aria-live="polite"></section>
  </main>

  <footer class="page-footer">
    <p>Real flight prices via Travelpayouts. See README.md for setup.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
